# Makes Argo CD wait for each child Application to be Healthy before
# starting the next sync wave. Without it, waves across child apps
# don't enforce ordering.
#
# Apply:  kubectl -n argocd patch configmap argocd-cm --type merge --patch-file argocd-cm-health-patch.yaml
# If argocd-cm is managed by Helm/Argo CD, add this key to those values instead.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
