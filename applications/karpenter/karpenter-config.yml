apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/som-esh/platform-agro.git
    targetRevision: master
    path: karpenter

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    syncOptions:
      - ServerSideApply=true