apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      valuesObject:
        features:
          # Webhooks never block the API server if Kyverno is down
          forceFailurePolicyIgnore:
            enabled: true
        config:
          # Kyverno's webhooks skip these namespaces entirely
          webhooks:
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - kyverno
                      - argocd
                      - istio-system
                      - monitoring
                      - cert-manager
        # Removes the webhooks on uninstall (the pre-delete hook)
        webhooksCleanup:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Kyverno's CRDs are too large for client-side apply
