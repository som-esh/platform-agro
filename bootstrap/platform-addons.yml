apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-addons
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/som-esh/platform-agro.git
    targetRevision: master
    path: applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd